const tnoForm=document.querySelector(".tno-form");
if(tnoForm){
 tnoForm.addEventListener("submit",async function(e){
  e.preventDefault();
  const btn=tnoForm.querySelector("button[type=submit]");
  const original=btn?btn.textContent:"ENVOYER MA CANDIDATURE ↗";
  if(btn){btn.disabled=true;btn.textContent=document.documentElement.lang==="ar"?"جارٍ الإرسال…":"ENVOI EN COURS…";}
  const fd=new FormData(tnoForm);
  const payload={prenom:String(fd.get("prenom")||"").trim(),nom:String(fd.get("nom")||"").trim(),email:String(fd.get("email")||"").trim(),phone:String(fd.get("phone")||"").trim(),wilaya:String(fd.get("wilaya")||"").trim(),role:String(fd.get("role")||"").trim(),message:String(fd.get("message")||"").trim()};
  try{
   const r=await fetch(new URL("/api/public/applications",window.location.origin).href,{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify(payload),cache:"no-store"});
   const result=await r.json().catch(()=>({}));
   if(!r.ok||result.ok!==true) throw new Error(result.message||("HTTP "+r.status));
   tnoForm.reset();
   if(btn)btn.textContent=document.documentElement.lang==="ar"?"تم إرسال الطلب ✓":"CANDIDATURE ENVOYÉE ✓";
   setTimeout(()=>{if(btn){btn.disabled=false;btn.textContent=original;}},2500);
  }catch(err){
   if(btn){btn.disabled=false;btn.textContent=original;}
   alert((document.documentElement.lang==="ar"?"تعذر إرسال التسجيل: ":"Impossible d'envoyer la candidature : ")+err.message);
  }
 });
}
</script></body></html>
