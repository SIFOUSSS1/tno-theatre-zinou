[build]
  publish = "TNO_SITE"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "/.netlify/functions/api/uploads/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/admin/"
  to = "/admin/admin.html"
  status = 200
